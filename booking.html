<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Wisuda</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icon -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/beranda.css">
    <link rel="stylesheet" href="css/booking.css">
</head>


<body>

    
    <header class="header">
        <div class="header-container">
            <a href="index.html" class="logo">
                <img src="assets\logo.png" alt="Logo">
            </a>
            <button class="menu-toggle" id="menuToggle">
                <i class="bi bi-list"></i>
            </button>
            <nav class="navbar" id="navbar">
                <a href="index.html">Beranda</a>
                <a href="galeri.html">Galeri</a>
                <a href="paket.html">Daftar Paket</a>
                <a href="kalender.html">Kalender</a>
                <a href="syarat.html">Syarat & Ketentuan</a>
                <a href="booking.html">Booking</a>
                <a href="ulasan.html">Ulasan</a>
                <a href="tentang.html">Tentang Kami</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="booking">
            <div class="booking-container">
                <img src="assets/logohitam.png" alt="Logo" class="booking-logo">
                <h1>FORMULIR PEMESANAN</h1>
                <form id="bookingForm">
                    <div class="input-icon">
                        <i class="bi bi-pencil"></i>
                        <input type="text" class="form-control" placeholder="Nama Lengkap" id="nama">
                    </div>
                    <div class="input-icon">
                        <i class="bi bi-instagram"></i>
                        <input type="text" class="form-control" placeholder="Instagram" id="instagram">
                    </div>
                    <div class="input-icon">
                        <i class="bi bi-telephone"></i>
                        <input type="tel" class="form-control" placeholder="Nomor Telepon" id="telepon">
                    </div>
                    <div class="input-icon">
                        <i class="bi bi-building"></i>
                        <input type="text" class="form-control" placeholder="Asal Universitas" id="universitas">
                    </div>
                    <div class="input-icon">
                        <i class="bi bi-calendar-event"></i>
                        <input type="date" class="form-control" id="tanggal">
                    </div>
                    <div class="input-icon">
                        <i class="bi bi-clock"></i>
                        <input type="time" class="form-control" id="waktu">
                    </div>
                    <div class="input-icon">
                        <i class="bi bi-geo-alt"></i>
                        <input type="text" class="form-control" placeholder="Lokasi Pemotretan" id="lokasi">
                    </div>
                    <div class="radio-group">
                        <label>Paket yang Dipilih</label>
                        <div class="radio-list">
                            <label>
                                <input type="radio"  name="paket">
                                Paket Foto Only
                            </label>
                            <label>
                                <input type="radio" name="paket">
                                Paket Video Only
                            </label>
                            <label>
                                <input type="radio" name="paket">
                                Paket Foto dan Video
                            </label>
                        </div>
                    </div>

                    <div class="radio-group">
                        <label>Genre yang Dipilih</label>
                        <div class="radio-list">
                            <label>
                                <input type="radio" name="genre">
                                Family
                            </label>
                            <label>
                                <input type="radio" name="genre">
                                Portrait Beauty
                            </label>
                            <label>
                                <input type="radio" name="genre">
                                Natural Ekspresif
                            </label>
                            <label>
                                <input type="radio" name="genre">
                                Elegan
                            </label>
                        </div>
                    </div>

                    <div class="input-icon texarea-icon">
                        <i class="bi bi-journal-text"></i>
                        <textarea class="form-control" rows="4" placeholder="Note (Opsional)"></textarea>
                    </div>

                    <div class="text-center">
                        <button type="button" class="btn btn-booking" data-bs-toggle="modal" data-bs-target="#modalKonfirmasi">
                            Simpan Data
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>


    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <span>2026 Galeri Wisuda | Foto dan Video Momen Wisuda</span>
            <a href="#">
                <i class="bi bi-instagram"></i>
                galeriwisuda.picture
            </a>
            <a href="#">
                <i class="bi bi-whatsapp"></i>
                +62 822 3611 3261
            </a>
        </div>
    </footer>



    <!-- ================= POP UP KONFORMASI ================= -->
    <div class="modal fade" id="modalKonfirmasi" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content popup-konfirmasi">
                <div class="modal-body text-center">
                    <div class="popup-icon">
                        <img src="assets\warning.png" alt="Warning">
                        <img src="assets\pinguin.png" alt="Penguin">
                    </div>
                    <h2>PERHATIAN!</h2>
                    <p>Apakah Data yang Diisikan Sudah Benar?</p>
                    <div class="popup-button">
                        <button class="btn btn-warning" id="btnYa">
                            Sudah
                        </button>
                        <button class="btn btn-light" data-bs-dismiss="modal">
                            Batal
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= POPUP BBERHASIL ================= -->
    <div class="modal fade" id="modalBerhasil" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content popup-berhasil">
                <div class="modal-body text-center">
                    <div class="popup-icon">
                        <img src="assets\superhero.png" alt="">
                    </div>
                    <h1>Terima Kasih</h1>
                    <p> Data Berhasil Tersimpan!</p>
                    <button class="btn btn-warning" id="btnTutup" data-bs-dismiss="modal">
                        Tutup
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Javascript -->
    <script src="js/main.js"></script>
    <script src="js/booking.js"></script>
</body>



</html>
